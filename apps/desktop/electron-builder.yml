# Packaging for the desktop app. One config, three platforms, one command each.
#
# appId is a placeholder: change it (and productName) to the domain the app is distributed under
# before a public release. Nothing else in this file names a company, server or person.
appId: app.agent.desktop
productName: Agent
executableName: Agent

directories:
  output: release
  buildResources: build

# Everything the app needs is bundled by electron-vite. Source maps and TypeScript sources stay out
# of the release; the renderer, preload and main bundles are all that ship.
asar: true
# The AI engines the Claude Agent SDK and the Codex SDK ship are native programs: they must sit outside
# app.asar to be started (runtime/cli-host.ts maps the path to app.asar.unpacked).
asarUnpack:
  - '**/node_modules/@anthropic-ai/claude-agent-sdk-*/**'
  - '**/node_modules/@openai/codex-*/**'
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsx'

# The optional overlay-network helper (tools/agent-net, Go). tools/agent-net/build.sh lays the binaries out as
# dist/electron/<os>-<arch>/; the app finds it at <resources>/agent-net/ (main/devices/net.ts findSidecar). When it
# has not been built, electron-builder warns and leaves it out: the app works, Network = Tailscale/Headscale says so.
extraResources:
  - from: ../../tools/agent-net/dist/electron/${os}-${arch}
    to: agent-net
    filter:
      - agent-net
      - agent-net.exe

npmRebuild: false
buildDependenciesFromSource: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Per-user install: no administrator prompt and no machine-wide changes.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Hardened runtime is on. Signing and notarisation read credentials from the environment
  # (CSC_LINK / CSC_KEY_PASSWORD, and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID).
  # With none set, electron-builder skips signing and the dmg still builds for local testing.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: Utility
  maintainer: Agent
  synopsis: A desktop home for your agent
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-${arch}.${ext}

# No update server is baked in. A build may provide AGENT_UPDATE_URL at runtime; see src/main/updates.ts.
publish: null
