<title>Agent Desktop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400..700&display=swap">
<style>
/* Layout concept: a real desktop window. Left rail (agent, nav, chats), one big rounded sheet, and a docked side panel in chat.
   Tokens are the phone app's own (ui/theme/Theme.kt): iris accent, amber only for "needs you", warm off-white / deep violet-black. */
:root{
  --bg:#FAF8F4; --on-bg:#1B1A1F;
  --primary:#4A3FD1; --on-primary:#FBFAFF; --pc:#E4E0FF; --on-pc:#1C1466;
  --sc:#E6E3F2; --on-sc:#1D1B2B;
  --tert:#8A5100; --tc:#FFE2BF; --on-tc:#2D1700;
  --err:#B3261E; --ec:#F9DEDC; --on-ec:#410E0B;
  --sv:#E6E3EC; --on-sv:#4A4852;
  --s-lowest:#FEFDFB; --s-low:#F5F3EE; --s-mid:#EFEDE8; --s-high:#E9E7E2; --s-highest:#E3E1DC;
  --outline:#797683; --outline-v:#CAC6D2;
  --ok:#1E6B3A; --on-ok:#F4FFF6; --okc:#CFEBD7;
  --mascot:#F29A2E; --eye:#3A1F00;
  --desk:#E4E0EC; --shadow:0 24px 70px rgba(40,30,110,.20), 0 2px 8px rgba(40,30,110,.10);
  --r-sm:12px; --r-md:20px; --r-lg:28px; --r-xl:36px;
  --effects:cubic-bezier(.2,0,0,1);
  --spatial:cubic-bezier(.34,1.45,.64,1);
}
@supports (transition-timing-function:linear(0,1)){
  :root{--spatial:linear(0,.18 6%,.52 13%,.87 21%,1.05 29%,1.08 35%,1.04 43%,1 55%,.99 68%,1)}
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131218; --on-bg:#E9E7EE;
    --primary:#C3BBFF; --on-primary:#241A7A; --pc:#3A2FB0; --on-pc:#E7E3FF;
    --sc:#45435A; --on-sc:#E6E3F2;
    --tert:#FFB86B; --tc:#6A3D00; --on-tc:#FFDDB8;
    --err:#F2B8B5; --ec:#8C1D18; --on-ec:#F9DEDC;
    --sv:#47454F; --on-sv:#BDBAC8;
    --s-lowest:#0E0D12; --s-low:#1A1920; --s-mid:#1F1E25; --s-high:#292830; --s-highest:#34333B;
    --outline:#928F9C; --outline-v:#47454F;
    --ok:#8FD6A6; --on-ok:#0D3A1D; --okc:#1F4D2E;
    --mascot:#FFB86B; --eye:#3A1F00;
    --desk:#0A0910; --shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131218; --on-bg:#E9E7EE;
  --primary:#C3BBFF; --on-primary:#241A7A; --pc:#3A2FB0; --on-pc:#E7E3FF;
  --sc:#45435A; --on-sc:#E6E3F2;
  --tert:#FFB86B; --tc:#6A3D00; --on-tc:#FFDDB8;
  --err:#F2B8B5; --ec:#8C1D18; --on-ec:#F9DEDC;
  --sv:#47454F; --on-sv:#BDBAC8;
  --s-lowest:#0E0D12; --s-low:#1A1920; --s-mid:#1F1E25; --s-high:#292830; --s-highest:#34333B;
  --outline:#928F9C; --outline-v:#47454F;
  --ok:#8FD6A6; --on-ok:#0D3A1D; --okc:#1F4D2E;
  --mascot:#FFB86B; --eye:#3A1F00;
  --desk:#0A0910; --shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--desk); color:var(--on-bg);
  font:400 14px/1.45 'Roboto',system-ui,sans-serif;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit;padding:0}
svg{flex:none}
.ico{display:block}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
::selection{background:var(--pc);color:var(--on-pc)}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}

/* ---------- window ---------- */
.win{height:100%;min-height:620px;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);position:relative}
.titlebar{height:46px;display:flex;align-items:center;gap:12px;padding:0 0 0 16px;-webkit-user-select:none;user-select:none}
.tb-brand{display:flex;align-items:center;gap:10px;font:500 13px/1 'Roboto Flex','Roboto',sans-serif;color:var(--on-sv);min-width:200px}
.cmdbar{flex:0 1 480px;margin:0 auto;height:34px;border-radius:999px;background:var(--s-high);color:var(--on-sv);display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;font-size:13px;text-align:left;transition:background .2s var(--effects)}
.cmdbar:hover{background:var(--s-highest)}
.cmdbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:500 11px/1 'Roboto',sans-serif;padding:5px 7px;border-radius:8px;background:var(--bg);color:var(--on-sv);border:1px solid var(--outline-v)}
.tb-right{display:flex;align-items:center;min-width:200px;justify-content:flex-end}
.syncpill{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:500;color:var(--on-sv);margin-right:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tb-btn{width:38px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--on-sv);transition:background .2s var(--effects)}
.tb-btn:hover{background:var(--s-high)}
.wc{width:46px;height:46px;display:grid;place-items:center;color:var(--on-sv)}
.wc:hover{background:var(--s-high)}
.wc.close:hover{background:var(--err);color:var(--bg)}
.wc.close:hover{color:#fff}

/* ---------- type ---------- */
.eyebrow{font:700 11px/16px 'Roboto',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.eyebrow.mute{color:var(--on-sv)}
.sec{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.sec-line{font-size:13px;color:var(--on-sv)}
.sec-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-row .sec{margin:0}
.h1{font:500 clamp(30px,3.1vw,42px)/1.12 'Roboto Flex','Roboto',sans-serif;letter-spacing:-.5px;text-wrap:balance}
.h2{font:500 24px/1.25 'Roboto Flex','Roboto',sans-serif}
.h3{font:600 16px/1.3 'Roboto',sans-serif}
.lead{font-size:16px;line-height:1.55;color:var(--on-sv)}
.muted{color:var(--on-sv)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;font:500 14px/1 'Roboto',sans-serif;letter-spacing:.1px;transition:border-radius .45s var(--spatial),background .2s var(--effects),transform .45s var(--spatial)}
.btn:active{border-radius:14px;transform:scale(.985)}
.btn.fill{background:var(--primary);color:var(--on-primary)}
.btn.fill:hover{background:color-mix(in srgb,var(--primary) 88%,var(--on-primary))}
.btn.tonal{background:var(--sc);color:var(--on-sc)}
.btn.tonal:hover{background:color-mix(in srgb,var(--sc) 85%,var(--on-sc))}
.btn.line{border:1.5px solid var(--outline);color:var(--on-bg);background:transparent}
.btn.line:hover{background:var(--s-high)}
.btn.text{padding:0 16px;color:var(--primary);background:transparent}
.btn.text:hover{background:var(--pc)}
.btn.block{width:100%}
.btn.lg{height:56px;font-size:15px}
.btn.sm{height:36px;padding:0 16px;font-size:13px}
.btn[disabled]{background:var(--s-high);color:var(--on-sv);cursor:not-allowed;opacity:.8}
.btn.on-tc{border:1.5px solid color-mix(in srgb,var(--on-tc) 45%,transparent);color:var(--on-tc);background:transparent}
.btn.on-tc:hover{background:color-mix(in srgb,var(--on-tc) 12%,transparent)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--on-sv);background:transparent;transition:background .2s var(--effects),border-radius .45s var(--spatial)}
.ib:hover{background:var(--s-high)}
.ib.tonal{background:var(--s-high)}
.ib:active{border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--outline-v);font:500 13px/1 'Roboto',sans-serif;color:var(--on-sv);background:transparent;transition:background .2s var(--effects),border-radius .45s var(--spatial)}
.chip:hover{background:var(--s-high)}
.chip.on{background:var(--sc);color:var(--on-sc);border-color:transparent}
.chip:active{border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font:700 11px/1 'Roboto',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.pill.ok{background:var(--okc);color:var(--ok)}
.pill.warn{background:var(--tc);color:var(--on-tc)}
.pill.pri{background:var(--pc);color:var(--on-pc)}
.pill.mute{background:var(--s-high);color:var(--on-sv)}
.seg{display:flex;padding:4px;gap:4px;border-radius:999px;background:var(--s-mid)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;height:42px;border-radius:999px;font:500 13px/1 'Roboto',sans-serif;color:var(--on-sv);transition:background .25s var(--effects),border-radius .45s var(--spatial)}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.seg button:not(.on):hover{background:var(--s-high)}

/* ---------- fields ---------- */
.field{display:block;position:relative}
.field label{display:block;font:500 12px/1 'Roboto',sans-serif;color:var(--on-sv);margin:0 0 8px 4px}
.input{width:100%;height:56px;border-radius:var(--r-md);border:1.5px solid var(--outline);background:var(--s-lowest);color:var(--on-bg);padding:0 52px 0 18px;font-size:16px;transition:border-color .2s var(--effects),box-shadow .2s var(--effects)}
.input::placeholder{color:var(--on-sv);opacity:.75}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
.input.bad{border-color:var(--err)}
.field .wrap{position:relative}
.field .eye{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--on-sv)}
.field .eye:hover{background:var(--s-high)}
.err{font-size:12px;color:var(--err);margin:6px 0 0 4px;min-height:16px}

/* ---------- onboarding ---------- */
.ob{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;padding:0 12px 12px;min-height:0}
.ob-hero{background:var(--pc);color:var(--on-pc);border-radius:var(--r-xl);padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;min-height:0}
.ob-hero .h1{font-size:clamp(34px,3.6vw,52px);max-width:560px}
.ob-hero .eyebrow{color:var(--on-pc)}
.ob-hero p{color:color-mix(in srgb,var(--on-pc) 82%,transparent);font-size:17px;line-height:1.55;max-width:470px}
.pair{display:flex;align-items:flex-end;gap:14px;margin-top:26px}
.pair .dev{background:var(--bg);color:var(--on-bg);border-radius:20px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pair .phone{width:128px;border-radius:26px;padding:12px}
.pair .desk{flex:1;max-width:340px}
.pair .ln{height:8px;border-radius:6px;background:var(--s-high);margin-top:8px}
.pair .bub{background:var(--pc);color:var(--on-pc);border-radius:14px 14px 4px 14px;font-size:11px;line-height:1.3;padding:7px 9px;margin-top:8px;margin-left:auto;width:max-content;max-width:100%}
.pair .agt{font-size:11px;line-height:1.35;margin-top:8px}
.pair .sync{align-self:center;color:var(--on-pc)}
.ob-hero .big-mascot{display:grid;place-items:center;flex:1;min-height:0;padding:12px 0}
.ob-hero .big-mascot svg{width:min(300px,34vh);height:auto}
.ob-main{display:flex;flex-direction:column;min-height:0;overflow:auto;padding:28px 56px 36px}
.dots{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.dots i{width:10px;height:10px;border-radius:999px;background:var(--outline-v);transition:width .45s var(--spatial),background .2s}
.dots i.done{background:var(--primary)}
.dots i.cur{width:30px;background:var(--primary)}
.ob-col{width:100%;max-width:440px;margin:auto;display:flex;flex-direction:column;gap:18px;padding:12px 0}
.ob-col .h1{font-size:34px}
.or{display:flex;align-items:center;gap:12px;color:var(--on-sv);font-size:12px}
.or::before,.or::after{content:"";height:1px;background:var(--outline-v);flex:1}
.qr{display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r-lg);background:var(--s-low)}
.qr svg{background:#fff;border-radius:14px;padding:8px;width:104px;height:104px}
.steps{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:var(--r-lg);background:var(--s-low)}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.45}
.steps b{width:24px;height:24px;border-radius:50%;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;font:700 12px/1 'Roboto',sans-serif;flex:none;margin-top:0}
.prov{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--s-low);border-radius:var(--r-lg);padding:20px 22px}
.card.mid{background:var(--s-mid)}
.syncrow{display:flex;align-items:center;gap:14px;padding:14px 4px}
.syncrow+.syncrow{border-top:1px solid var(--outline-v)}
.syncrow .st{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s-high);color:var(--on-sv);transition:background .3s var(--effects),color .3s var(--effects)}
.syncrow.done .st{background:var(--okc);color:var(--ok)}
.syncrow .t{flex:1}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent;transition:border-radius .45s var(--spatial),transform .45s var(--spatial)}
.sw.on{border-radius:14px;border-color:var(--on-bg);transform:scale(1.04)}
.sw svg{color:#fff;mix-blend-mode:normal}
.mascots{display:flex;flex-wrap:wrap;gap:10px}
.mk{width:60px;height:60px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--s-mid);border:2px solid transparent;transition:background .2s,border-color .2s}
.mk.on{background:var(--pc);border-color:var(--primary)}
.preview{border-radius:var(--r-lg);background:var(--s-low);padding:18px;display:flex;flex-direction:column;gap:12px}
.preview .u{align-self:flex-end;background:var(--pc);color:var(--on-pc);padding:10px 16px;border-radius:20px 20px 6px 20px;max-width:80%}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);gap:12px;padding:0 12px 12px;min-height:0}
.shell.panel{grid-template-columns:272px minmax(0,1fr) 380px}
.shell.col{grid-template-columns:76px minmax(0,1fr)}
.shell.col.panel{grid-template-columns:76px minmax(0,1fr) 380px}
.rail{display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto;padding:2px 4px 4px;scrollbar-width:thin}
.me{display:flex;align-items:center;gap:12px;padding:6px 8px 12px;text-align:left;border-radius:var(--r-md)}
.me:hover{background:var(--s-mid)}
.me .nm{font:500 18px/1.2 'Roboto Flex','Roboto',sans-serif}
.me .st{font-size:12px;color:var(--on-sv);margin-top:2px}
.me .st.warn{color:var(--tert);font-weight:500}
.newchat{margin:0 4px 10px}
.nav{display:flex;align-items:center;gap:14px;height:48px;padding:0 18px;border-radius:999px;color:var(--on-sv);font:500 14px/1 'Roboto',sans-serif;text-align:left;width:100%;transition:background .2s var(--effects),border-radius .45s var(--spatial)}
.nav:hover{background:var(--s-mid)}
.nav.on{background:var(--sc);color:var(--on-sc)}
.nav:active{border-radius:16px}
.nav .lbl{flex:1}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--tc);color:var(--on-tc);font:700 12px/22px 'Roboto',sans-serif;text-align:center}
.rail .grp{margin:16px 12px 6px}
.chatrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--r-md);text-align:left;width:100%;color:var(--on-bg);transition:background .2s}
.chatrow:hover{background:var(--s-mid)}
.chatrow.on{background:var(--s-high)}
.chatrow .ct{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatrow .tm{font-size:12px;color:var(--on-sv)}
.chatrow svg{color:var(--on-sv)}
.rail .spacer{flex:1;min-height:12px}
.acct{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:var(--r-md);margin-top:6px;border-top:1px solid var(--outline-v);border-radius:0;padding-top:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font:700 14px/1 'Roboto',sans-serif;flex:none}
.badge.pos{display:none}
.col .badge.pos{display:block}
.col .lbl,.col .grp,.col .chatlist,.col .acct .who,.col .me .who,.col .newchat span,.col .badge.inline{display:none}
.col .nav{justify-content:center;padding:0}
.col .newchat{padding:0;width:52px;margin-inline:auto}
.col .me,.col .acct{justify-content:center}
.col .badge.pos{position:absolute;top:2px;right:6px;min-width:18px;height:18px;line-height:18px;font-size:11px;padding:0 5px}
.nav{position:relative}

.sheet{background:var(--s-lowest);border-radius:var(--r-lg);overflow:auto;min-height:0;scrollbar-width:thin}
.page{padding:36px 44px 56px;max-width:1240px;margin:0 auto}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.ph .eyebrow{margin-bottom:6px;display:block}
.ph .lead{margin-top:6px;font-size:15px}

/* ---------- home ---------- */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:34px 28px;align-items:start}
.col-a,.col-b{display:flex;flex-direction:column;gap:30px;min-width:0}
.now{background:var(--pc);color:var(--on-pc);border-radius:var(--r-xl);padding:28px 30px 26px;display:flex;flex-direction:column;gap:22px;text-align:left;width:100%;transition:border-radius .5s var(--spatial)}
.now:hover{border-radius:40px 32px 40px 32px}
.now-top{display:flex;align-items:center;gap:22px}
.now .nm{font:500 30px/1.15 'Roboto Flex','Roboto',sans-serif}
.now .sub{font-size:15px;color:color-mix(in srgb,var(--on-pc) 85%,transparent)}
.now .eyebrow{color:color-mix(in srgb,var(--on-pc) 85%,transparent)}
.now-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;font:500 17px/1.3 'Roboto',sans-serif}
.stepchips{display:flex;gap:8px;flex-wrap:wrap}
.sc-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font:500 12px/1 'Roboto',sans-serif;background:color-mix(in srgb,var(--on-pc) 14%,transparent);color:var(--on-pc)}
.wave{width:100%;height:14px;display:block}
.need{background:var(--tc);color:var(--on-tc);border-radius:var(--r-lg);padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.need .eyebrow{color:var(--on-tc);display:flex;align-items:center;gap:8px}
.need .q{font:500 20px/1.3 'Roboto Flex','Roboto',sans-serif}
.need .chips{display:flex;gap:8px;flex-wrap:wrap}
.ans{height:44px;padding:0 20px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--on-tc) 40%,transparent);color:var(--on-tc);font:500 14px/1 'Roboto',sans-serif;transition:background .2s,color .2s,border-radius .45s var(--spatial)}
.ans:hover{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.ans:active{border-radius:14px}
.need.done{background:var(--s-low);color:var(--on-bg)}
.need.done .eyebrow{color:var(--ok)}
.list{background:var(--s-low);border-radius:var(--r-lg);padding:8px}

/* ---------- mascots: same family as the phone app (rounded polygons, eyes, morph when working) ---------- */
const MASC={
  scout:{k:'w',n:9,a:.07,bn:9,ba:.17,spin:1,label:'Scout'},
  bloom:{k:'w',n:5,a:.2,bn:5,ba:.3,spin:1,label:'Bloom'},
  clover:{k:'w',n:4,a:.22,bn:8,ba:.12,spin:1,label:'Clover'},
  puff:{k:'w',n:8,a:.09,bn:12,ba:.07,spin:0,label:'Puff'},
  gem:{k:'s',p:1.55,bp:1.25,rot:Math.PI/4,spin:0,label:'Gem'},
  pebble:{k:'s',p:2.9,bp:2,rot:0,spin:0,label:'Pebble'},
  heart:{k:'h',spin:0,label:'Heart'},
};
const mcache={};
function mpath(id,busy){
  const key=id+(busy?'b':'r'); if(mcache[key])return mcache[key];
  const m=MASC[id],N=120,pts=[];
  if(m.k==='h'){
    let xs=[],ys=[];
    for(let i=0;i<N;i++){const t=i/N*2*Math.PI;xs.push(16*Math.pow(Math.sin(t),3));ys.push(-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)));}
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),s=88/Math.max(x1-x0,y1-y0);
    for(let i=0;i<N;i++)pts.push([50+(xs[i]-(x0+x1)/2)*s,52+(ys[i]-(y0+y1)/2)*s]);
  }else{
    for(let i=0;i<N;i++){
      const th=i/N*2*Math.PI-Math.PI/2;let r;
      if(m.k==='w'){const n=busy?m.bn:m.n,a=busy?m.ba:m.a;r=(1-a)+a*Math.cos(n*(th+Math.PI/2));}
      else{const p=busy?m.bp:m.p,c=Math.abs(Math.cos(th-m.rot)),s=Math.abs(Math.sin(th-m.rot));r=1/Math.pow(Math.pow(c,p)+Math.pow(s,p),1/p);}
      pts.push([50+46*r*Math.cos(th),50+46*r*Math.sin(th)]);
    }
  }
  return mcache[key]='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';
}
function mascot(size,o={}){
  const id=o.id||S.mascot,m=MASC[id],d1=mpath(id,false),d2=mpath(id,true);
  const anim=o.working&&!reduce?`<animate attributeName="d" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".4 0 .2 1;.4 0 .2 1" values="${d1};${d2};${d1}"/>`:'';
  const rot=o.working&&m.spin&&!reduce?'<animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="14s" repeatCount="indefinite"/>':'';
  const fill=o.fill?`fill="${o.fill}"`:'fill="var(--mascot)"';
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><g>${rot}<path d="${d1}" ${fill}>${anim}</path></g><g class="eyes" fill="var(--eye)"><ellipse cx="37.5" cy="49" rx="4.3" ry="6.4"/><ellipse cx="62.5" cy="49" rx="4.3" ry="6.4"/></g></svg>`;
}
const eyeCss=document.createElement('style');
eyeCss.textContent='.eyes ellipse{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}';
document.head.appendChild(eyeCss);

let uid=0;
function wave(pct,{track='var(--on-pc)',line='var(--on-pc)'}={}){
  const id='w'+(++uid),anim=reduce?'':'<animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-28 0" dur="1.4s" repeatCount="indefinite"/>';
  return `<svg class="wave" width="100%" height="14" aria-hidden="true"><defs><pattern id="${id}" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M0 7Q7 0 14 7T28 7" fill="none" stroke="${line}" stroke-width="3" stroke-linecap="round"/>${anim}</pattern></defs><line x1="${pct}%" y1="7" x2="calc(100% - 2px)" y2="7" stroke="${track}" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/><rect x="0" y="0" width="${pct}%" height="14" fill="url(#${id})"/></svg>`;
}
function ring(pct,size=44){
  const r=(size-8)/2,c=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--outline-v)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}"/></svg><span>${Math.round(pct)}</span></div>`;
}
function qr(){
  let s=7,rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const N=25,cells=[];
  const fin=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||j===0||i===6||j===6,c=i>=2&&i<=4&&j>=2&&j<=4;if(e||c)cells.push([x+i,y+j]);}};
  const inF=(i,j)=>(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(!inF(i,j)&&rnd()>.52)cells.push([i,j]);
  fin(0,0);fin(N-7,0);fin(0,N-7);
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" role="img" aria-label="Example pairing code">${cells.map(c=>`<rect x="${c[0]}" y="${c[1]}" width="1" height="1" fill="#1B1A1F"/>`).join('')}</svg>`;
}

function runSync(){

    syncTimer.push(setTimeout(()=>{const r=$('#sr'+i);if(!r)return;$('#ss'+i).innerHTML=`<span class="spin" style="display:inline-block">${ico('sync',16)}</span>`;},i*650+150));

  });
}

/* ---------- overlays ---------- */
const PAL=[['Jump to',[['home','home','Home','go','home'],['chat','chat','Chat','go','chat'],['tasks','tasks','Tasks','go','tasks'],['memory','memory','Memory','go','memory'],['clock','Routines','Routines','go','routines'],['apps','Connections','Connections','go','connections'],['sliders','Settings','Settings','go','prefs']]],
 ['Do something',[['plus','New chat','','newchat'],['plus','Add a to-do','','addtodo'],['bolt','Quick ask','Ctrl Alt Space','quick'],['sun','Switch light and dark','','theme']]]];
let palSel=0,palItems=[];
function openPalette(){
  $('#overlay').innerHTML=`<div class="scrim" data-act="closeov"><div class="palette" role="dialog" aria-label="Search or jump to"><label class="search" for="pq">${ico('search',22)}<input id="pq" placeholder="Search, jump to, or ask ${esc(S.agent)}" autocomplete="off"></label><div class="pal-list" id="pl"></div></div></div>`;
  palSel=0;fillPal('');const pq=$('#pq');pq.focus();
  pq.addEventListener('input',()=>{palSel=0;fillPal(pq.value);});
}
function fillPal(q){
  q=q.toLowerCase();palItems=[];let h='';
  PAL.forEach(([g,items])=>{
    const f=items.filter(it=>{const label=it.length===5?it[2]:it[1];return !q||label.toLowerCase().includes(q);});
    if(!f.length)return;
    h+=`<span class="eyebrow mute">${g.toUpperCase()}</span>`;
    f.forEach(it=>{
      const label=it.length===5?it[2]:it[1],act=it.length===5?it[3]:it[3],val=it.length===5?it[4]:'';
      const ic=it[0];const idx=palItems.length;palItems.push({act,val});
      h+=`<button class="pi ${idx===palSel?'sel':''}" data-act="palrun" data-i="${idx}">${ico(I[ic]?ic:'apps',20)}${label}${it.length===4&&it[2]?`<span class="kbds"><kbd>${it[2]}</kbd></span>`:''}</button>`;
    });
  });
  if(q)h+=`<span class="eyebrow mute">ASK</span><button class="pi ${palItems.length===palSel?'sel':''}" data-act="palrun" data-i="${palItems.length}">${ico('chat',20)}Ask ${esc(S.agent)}: “${esc(q)}”</button>`,palItems.push({act:'newchat',val:''});
  $('#pl').innerHTML=h||'<p class="muted" style="padding:20px">Nothing found.</p>';
}
function openQuick(){
  $('#overlay').innerHTML=`<div class="scrim" data-act="closeov"><div class="quick" role="dialog" aria-label="Quick ask"><div class="row">${mascot(44,{working:true})}<input id="qi" placeholder="Ask ${esc(S.agent)} anything" autocomplete="off"><button class="send" data-act="quicksend" aria-label="Send">${ico('arrow',22)}</button></div>
   <div class="ctx"><span class="eyebrow mute">USING</span><span class="chip on">${ico('clip',14)}Clipboard, 3 lines</span><span class="chip">${ico('monitor',14)}Active window: Spreadsheet</span><span style="margin-left:auto"><kbd>Enter</kbd> send · <kbd>Esc</kbd> close</span></div></div></div>`;
  $('#qi').focus();
}
const closeOv=()=>{$('#overlay').innerHTML='';};

/* ---------- render ---------- */
function render(keepScroll){
  titlebar();
  const v=S.view,st=$('#stage');
  let h;
  if(v==='signin')h=viewSignin();else if(v==='sync')h=viewSync();else if(v==='ai')h=viewAi();else if(v==='style')h=viewStyle();
  else{
    const inner=v==='home'?viewHome():v==='chat'?viewChat():v==='tasks'?viewTasks():v==='memory'?viewMemory():v==='routines'?viewRoutines():v==='connections'?viewConnections():viewPrefs();
    h=shell(inner,v==='chat'?chatPanel():'');
  }
  const prev=keepScroll&&$('#sheet')?$('#sheet').scrollTop:0;
  st.innerHTML=h;
  if(keepScroll&&$('#sheet'))$('#sheet').scrollTop=prev;
  if(v==='sync')runSync();
  if(v==='chat'){scrollChat();const ta=$('#msg');ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});ta.addEventListener('input',()=>{ta.style.height='48px';ta.style.height=Math.min(ta.scrollHeight,140)+'px';});}
  if(v==='memory'){const mq=$('#mq');mq.addEventListener('input',()=>{S.memQ=mq.value;$('#memlist').innerHTML=memList();});}
  if(v==='signin'){$('#f-sign').addEventListener('submit',e=>{e.preventDefault();const em=$('#em').value.trim(),pw=$('#pw').value,er=$('#e-sign');
    $('#em').classList.remove('bad');$('#pw').classList.remove('bad');
    if(!/^\S+@\S+\.\S+$/.test(em)){$('#em').classList.add('bad');er.textContent='That email does not look right.';return;}
    if(pw.length<6){$('#pw').classList.add('bad');er.textContent=S.mode==='new'?'Use at least 6 characters.':'Password is at least 6 characters.';return;}
    S.email=em;S.localOnly=false;go('sync');});}
  document.documentElement.dataset.view=v;
}
function go(v,opts){S.view=v;if(opts&&opts.tab)S.tasksTab=opts.tab;render();const sh=$('#sheet');if(sh)sh.scrollTop=0;}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='closeov'){if(e.target===t)closeOv();return;}
  if(a==='go'){go(v,{tab:t.dataset.tab});return;}
  switch(a){
    case 'mode':S.mode=v;render();break;
    case 'eye':{const f=t.closest('.field').querySelector('input');const show=f.type==='password';f.type=show?'text':'password';t.innerHTML=ico(show?'eyeoff':'eye',22);break;}
    case 'qrgo':S.mode='in';go('sync');break;
    case 'local':S.localOnly=true;go('sync');break;
    case 'prov':S.prov=v;S.keyOk=false;render();break;
    case 'sub':go('style');break;
    case 'check':{const k=$('#key'),er=$('#e-key'),b=$('#keybtn');
      if(S.keyOk){go('style');break;}
      if(!k.value.trim()){er.style.color='var(--err)';er.textContent='Paste your key first.';k.classList.add('bad');break;}
      k.classList.remove('bad');b.disabled=true;b.textContent='Checking…';
      setTimeout(()=>{S.keyOk=true;er.style.color='var(--ok)';er.textContent='Key works.';b.disabled=false;b.innerHTML='Continue'+ico('arrow',20);},900);break;}
    case 'accent':S.accent=v;applyAccent();render(true);break;
    case 'mascot':S.mascot=v;render(true);break;
    case 'finish':{const n=$('#nm'),g=$('#an');if(n&&n.value.trim())S.user=n.value.trim();if(g&&g.value.trim())S.agent=g.value.trim();go('home');break;}
    case 'newchat':go('chat');setTimeout(()=>{const m=$('#msg');m&&m.focus();},50);break;
    case 'rail':S.col=!S.col;render(true);break;
    case 'theme':{root.dataset.theme=isDark()?'light':'dark';applyAccent();render(true);break;}
    case 'settheme':root.dataset.theme=v;applyAccent();render(true);break;
    case 'todo':{e.stopPropagation();const x=todos.find(q=>q.id==t.dataset.id);x.done=x.done?0:1;render(true);break;}
    case 'todosel':S.todoSel=+t.dataset.id;render(true);break;
    case 'addtodo':{todos.unshift({id:Date.now(),t:'Call the dentist',due:'Thu 29 Oct',done:0,note:'Added just now. Book a check-up for next month.',ag:'Nova can find a slot that suits your calendar.'});S.todoSel=todos[0].id;S.tasksTab='todos';go('tasks');closeOv();break;}
    case 'tab':S.tasksTab=v;render(true);break;
    case 'answer':S.q='done';S.qa=v;render(true);break;
    case 'approve':S.appr='yes';render(true);break;
    case 'decline':S.appr='no';render(true);break;
    case 'send':sendMsg();break;
    case 'memsel':S.memSel=v;render(true);break;
    case 'memjump':S.memSel=v;go('memory');break;
    case 'kind':S.memKind=v;S.memQ=S.memQ;render(true);break;
    case 'rtog':{const r=routines[+t.dataset.id];r.on=r.on?0:1;render(true);break;}
    case 'ptog':{t.classList.toggle('on');t.setAttribute('aria-checked',t.classList.contains('on'));break;}
    case 'runnow':{t.disabled=true;t.innerHTML=ico('sync',18)+'Running…';setTimeout(()=>{t.disabled=false;t.innerHTML=ico('check',18)+'Done, 3 things found';},1400);break;}
    case 'signout':S.view='signin';S.mode='in';S.keyOk=false;render();break;
    case 'palette':openPalette();break;
    case 'quick':openQuick();break;
    case 'quicksend':closeOv();go('chat');break;
    case 'palrun':{const it=palItems[+t.dataset.i];closeOv();runPal(it);break;}
  }
});
function runPal(it){
  if(!it)return;
  if(it.act==='go')go(it.val);else if(it.act==='newchat'){go('chat');setTimeout(()=>{const m=$('#msg');m&&m.focus();},50);}
  else if(it.act==='addtodo')addTodoFromPal();
  else if(it.act==='quick')openQuick();
  else if(it.act==='theme'){root.dataset.theme=isDark()?'light':'dark';applyAccent();render(true);}
}
function addTodoFromPal(){todos.unshift({id:Date.now(),t:'Call the dentist',due:'Thu 29 Oct',done:0,note:'Added just now. Book a check-up for next month.',ag:'Nova can find a slot that suits your calendar.'});S.todoSel=todos[0].id;S.tasksTab='todos';go('tasks');}
document.addEventListener('keydown',e=>{
  const k=e.key;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'&&!ONB.includes(S.view)){e.preventDefault();openPalette();return;}
  if(k==='Escape'){closeOv();return;}

    if(k==='Enter'){e.preventDefault();const it=palItems[palSel];closeOv();runPal(it);}
  }
  if($('.quick')&&k==='Enter'){closeOv();go('chat');}
});

/* ---------- boot ---------- */
(function boot(){
  const h=(location.hash||'').replace('#','');
  const map={'v-signin':'signin','v-sync':'sync','v-ai':'ai','v-style':'style','v-home':'home','v-chat':'chat','v-tasks':'tasks','v-memory':'memory','v-routines':'routines','v-connections':'connections','v-prefs':'prefs'};
  if(map[h])S.view=map[h];
  if(!ONB.includes(S.view)&&S.view!=='home'){/* deep link into a screen */}
  applyAccent();render();
  if(h==='v-palette')openPalette();
  if(h==='v-quick')openQuick();
})();
})();
</script>
